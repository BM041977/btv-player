<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BTV Player</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0e1116">
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#0e1116;--panel:#171c24;--line:#262d38;--fg:#e8ecf2;--mut:#8b95a5;--acc:#3ea6ff;--bad:#ff6b6b}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;display:flex;align-items:center;justify-content:center;padding:16px}
.card{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px 20px;display:flex;flex-direction:column;gap:12px}
h1{margin:0;font-size:20px;letter-spacing:.02em}
h1 span{color:var(--acc)}
p{margin:0;color:var(--mut);font-size:14px}
input{font:inherit;color:inherit;width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px;letter-spacing:.08em;text-transform:uppercase}
input:focus-visible,button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
button{font:inherit;background:var(--acc);color:#04121f;border:0;border-radius:10px;padding:11px;font-weight:600;cursor:pointer}
button:disabled{opacity:.6;cursor:default}
.err{color:var(--bad);min-height:1.4em;font-size:14px}
</style>
</head>
<body>
<form class="card" id="f" autocomplete="off" hidden>
  <h1>BTV <span>Player</span></h1>
  <p>Escribe tu código de acceso.</p>
  <input id="code" type="text" placeholder="XXX-XXXX-XXXX-XXXX" autocapitalize="characters" autocomplete="off" autocorrect="off" spellcheck="false" aria-label="Código de acceso">
  <div class="err" id="err" role="alert"></div>
  <button id="go" type="submit">Entrar</button>
  <p>¿No tienes código? Pídeselo a Baldemar Maza León, 9612170091.</p>
</form>
<script>
(function(){
  var KEY='btv.k', enc=new TextEncoder(), ITER=150000;
  var $=function(i){return document.getElementById(i)};
  function b64d(s){var b=atob(s),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a}
  function b64e(a){var s='';a=new Uint8Array(a);for(var i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);return btoa(s)}
  function aes(raw){return crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt'])}
  function dec(key,buf){buf=new Uint8Array(buf);return crypto.subtle.decrypt({name:'AES-GCM',iv:buf.slice(0,12)},key,buf.slice(12))}
  function norm(s){return String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,'')}
  function getBuf(u){return fetch(u,{cache:'no-cache'}).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.arrayBuffer()})}

  /* Con la llave ya abierta: baja la app cifrada, la descifra y la arranca */
  function launch(raw){
    return aes(raw).then(function(key){
      return getBuf('app.enc').then(function(b){return dec(key,b)}).then(function(plain){
        var of=window.fetch.bind(window);
        /* las listas propias (relativas) se descifran al vuelo; todo lo demás va directo */
        window.fetch=function(u,o){
          var s=typeof u==='string'?u:(u&&u.url)||'';
          if(s&&!/^([a-z][a-z0-9+.-]*:|\/\/)/i.test(s)&&/\.m3u8?(\?|#|$)/i.test(s)){
            return getBuf(s.split(/[?#]/)[0]+'.enc').then(function(b){return dec(key,b)}).then(function(p){return new Response(p,{status:200,headers:{'Content-Type':'text/plain; charset=utf-8'}})});
          }
          return of(u,o);
        };
        run(new TextDecoder().decode(plain));
      });
    });
  }

  function run(html){
    var d=new DOMParser().parseFromString(html,'text/html');
    var scripts=[].slice.call(d.querySelectorAll('script'));
    scripts.forEach(function(s){s.parentNode.removeChild(s)});
    document.head.textContent='';
    [].slice.call(d.head.childNodes).forEach(function(n){document.head.appendChild(document.importNode(n,true))});
    [].forEach.call(document.body.attributes,function(a){document.body.removeAttribute(a.name)});
    [].forEach.call(d.body.attributes,function(a){document.body.setAttribute(a.name,a.value)});
    document.body.textContent='';
    [].slice.call(d.body.childNodes).forEach(function(n){document.body.appendChild(document.importNode(n,true))});
    (function next(i){
      if(i>=scripts.length)return;
      var o=scripts[i],n=document.createElement('script');
      [].forEach.call(o.attributes,function(a){n.setAttribute(a.name,a.value)});
      if(o.src){n.onload=n.onerror=function(){next(i+1)};document.body.appendChild(n)}
      else{n.textContent=o.textContent;document.body.appendChild(n);next(i+1)}
    })(0);
  }

  function showForm(msg){$('f').hidden=false;$('err').textContent=msg||'';$('go').disabled=false;$('code').focus()}

  /* Código → llave maestra */
  function tryCode(code){
    var c=norm(code);
    if(c.length<8)return Promise.reject(new Error('bad'));
    var id=c.slice(0,3);
    return fetch('access.json',{cache:'no-cache'}).then(function(r){if(!r.ok)throw new Error('net');return r.json()}).then(function(list){
      var e=null;for(var i=0;i<list.length;i++)if(list[i].id===id){e=list[i];break}
      if(!e)throw new Error('bad');
      return crypto.subtle.importKey('raw',enc.encode(c),'PBKDF2',false,['deriveKey']).then(function(base){
        return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64d(e.s),iterations:ITER,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt'])
      }).then(function(wk){return dec(wk,b64d(e.w))}).catch(function(){throw new Error('bad')});
    });
  }

  $('f').addEventListener('submit',function(ev){
    ev.preventDefault();
    var go=$('go');go.disabled=true;$('err').textContent='';
    tryCode($('code').value).then(function(raw){
      try{localStorage.setItem(KEY,b64e(raw))}catch(e){}
      $('f').hidden=true;
      return launch(raw);
    }).catch(function(e){
      showForm(e&&e.message==='net'?'No se pudo conectar. Revisa tu internet.':e&&e.message==='bad'?'Código incorrecto.':'No se pudo abrir. Intenta de nuevo.');
    });
  });

  var saved=null;try{saved=localStorage.getItem(KEY)}catch(e){}
  if(saved){
    launch(b64d(saved)).catch(function(e){
      if(e&&e.name==='OperationError'){try{localStorage.removeItem(KEY)}catch(x){}showForm('Tu acceso cambió. Escribe tu código otra vez.')}
      else showForm('No se pudo conectar. Revisa tu internet y recarga la página.');
    });
  }else showForm();
})();
</script>
</body>
</html>
