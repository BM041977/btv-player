<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BTV Player</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0e1116">
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#0e1116;--panel:#171c24;--line:#262d38;--fg:#e8ecf2;--mut:#8b95a5;--acc:#3ea6ff;--fav:#ffc233;--bad:#ff6b6b}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  padding:env(safe-area-inset-top,0px) max(10px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(10px,env(safe-area-inset-left,0px));
  display:flex;flex-direction:column;gap:8px;height:100dvh}
header{display:flex;align-items:center;gap:8px;padding-top:8px}
h1{font-size:17px;margin:0;flex:1;letter-spacing:.02em}
h1 span{color:var(--acc)}
button,input,textarea{font:inherit;color:inherit}
button{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 11px;cursor:pointer}
button:hover{border-color:var(--acc)}
button.pri{background:var(--acc);color:#04121f;border-color:var(--acc);font-weight:600}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.row{display:flex;gap:8px;align-items:center}
.row.wrap{flex-wrap:wrap}
input[type=text],input[type=search],textarea{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 12px;min-width:0}
textarea{min-height:80px;resize:vertical}
/* zona fija: video y controles no se mueven */
.fixed{display:flex;flex-direction:column;gap:8px;min-width:0}
.stage{background:#000;border-radius:12px;overflow:hidden;position:relative;aspect-ratio:16/9;width:100%;max-height:42dvh;margin:0 auto}
video{width:100%;height:100%;display:block;background:#000;object-fit:contain}
.msg{position:absolute;inset:auto 8px 8px 8px;background:#000c;border-radius:8px;padding:6px 10px;font-size:13px}
.msg.err{color:var(--bad)}
.now{color:var(--mut);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.nav{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center}
.nav button{min-width:56px;font-size:18px;padding:8px 14px}
.sl{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:center;font-size:13px;color:var(--mut)}
.sl input{width:100%;accent-color:var(--acc)}
/* zona que se desplaza: canales */
.scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;display:flex;flex-direction:column;gap:8px;padding-bottom:8px}
.sticky{position:sticky;top:0;z-index:2;background:var(--bg);display:flex;flex-direction:column;gap:8px;padding:2px 0 6px}
.add{display:none;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;flex-direction:column;gap:8px}
.add.open{display:flex}
.add small{color:var(--mut)}
.tabs{display:flex;gap:6px}
.tabs button{flex:1}
.tabs button[aria-pressed=true]{border-color:var(--acc);color:var(--acc)}
ul{list-style:none;margin:0;padding:0}
li{display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--line)}
li .name{flex:1;min-width:0;text-align:left;background:none;border:0;padding:12px 4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
li.on .name{color:var(--acc);font-weight:600}
li .star{background:none;border:0;padding:8px 12px;color:var(--mut);font-size:18px}
li .star.f{color:var(--fav)}
.empty{color:var(--mut);padding:18px 4px;border:0}
@media (min-aspect-ratio:1/1) and (min-width:560px){
  body{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(240px,1fr);grid-template-rows:auto auto 1fr;column-gap:14px;row-gap:8px}
  header{grid-column:1/3}
  .urlbar{grid-column:1/3}
  .fixed{grid-column:1;grid-row:3;overflow-y:auto}
  .scroll{grid-column:2;grid-row:3}
  .stage{max-height:none}
}
</style>
</head>
<body>
<header>
  <h1>BTV <span>Player</span></h1>
  <button id="btnAdd" aria-expanded="false">+ Listas</button>
  <button id="btnInstall" hidden>Instalar</button>
</header>

<div class="row urlbar" style="flex-wrap:nowrap">
  <input type="text" id="url" placeholder="Pega aquí un enlace .m3u8, .mp4 o una lista .m3u" inputmode="url" enterkeyhint="go" autocomplete="off">
  <button id="btnGo" class="pri">Ir ▶</button>
</div>

<div class="fixed">
  <div class="stage">
    <video id="v" controls playsinline autopictureinpicture></video>
    <div id="msg" class="msg" hidden></div>
  </div>
  <div class="nav">
    <button id="btnPrev" aria-label="Canal anterior">◀</button>
    <div class="now" id="now" style="text-align:center">Elige un canal o pega un enlace</div>
    <button id="btnNext" aria-label="Canal siguiente">▶</button>
  </div>
  <div class="row wrap">
    <button id="btnPip" class="pri">Imagen en imagen</button>
    <button id="btnFull">Pantalla completa</button>
  </div>
  <label class="sl">Volumen <input type="range" id="vol" min="0" max="1" step="0.05" value="1"></label>
  <label class="sl">Brillo <input type="range" id="bri" min="0.4" max="1.6" step="0.05" value="1"></label>
</div>

<div class="scroll" id="scroll">
  <div class="add" id="addBox">
    <div class="row wrap">
      <button id="btnPlay" class="pri">Reproducir enlace</button>
      <button id="btnLoadList">Cargar enlace como lista</button>
    </div>
    <textarea id="paste" placeholder="O pega aquí el contenido de una lista M3U"></textarea>
    <div class="row wrap">
      <button id="btnParse">Cargar texto pegado</button>
      <button id="btnFile">Abrir archivo .m3u</button>
      <button id="btnClear">Borrar lista</button>
    </div>
    <input type="file" id="file" accept=".m3u,.m3u8,.txt,audio/x-mpegurl,application/vnd.apple.mpegurl" hidden>
    <small>Solo para canales y videos que tengas derecho a ver. Si un servidor bloquea cargar su lista desde el navegador, abre el archivo o pega el texto.</small>
  </div>
  <div class="sticky">
    <input type="search" id="q" placeholder="Buscar canal">
    <div class="tabs">
      <button id="tabAll" aria-pressed="true">Todos</button>
      <button id="tabFav" aria-pressed="false">Favoritos ★</button>
    </div>
  </div>
  <ul id="list"></ul>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.17/hls.min.js"></script>
<script>
(function(){
  var $=function(id){return document.getElementById(id)};
  var v=$('v'),msg=$('msg'),list=$('list'),now=$('now');
  var channels=[],favs={},cur=null,hls=null,onlyFav=false,shown=[];

  function load(k,d){try{var s=localStorage.getItem(k);return s?JSON.parse(s):d}catch(e){return d}}
  function save(k,x){try{localStorage.setItem(k,JSON.stringify(x))}catch(e){}}
  channels=load('btv.channels',[]);favs=load('btv.favs',{});

  function say(t,err){if(!t){msg.hidden=true;return}msg.textContent=t;msg.className='msg'+(err?' err':'');msg.hidden=false}

  /* Volumen y brillo (el brillo oscurece o aclara el video; el brillo de la pantalla lo controla Android) */
  var vol=load('btv.vol',1),bri=load('btv.bri',1);
  function applyAV(){v.volume=vol;v.style.filter='brightness('+bri+')';$('vol').value=vol;$('bri').value=bri}
  $('vol').oninput=function(){vol=parseFloat(this.value);v.muted=false;applyAV();save('btv.vol',vol)};
  $('bri').oninput=function(){bri=parseFloat(this.value);applyAV();save('btv.bri',bri)};
  applyAV();

  function parseM3U(text){
    var out=[],lines=text.split(/\r?\n/),name=null;
    for(var i=0;i<lines.length;i++){
      var l=lines[i].trim();
      if(!l)continue;
      if(l.indexOf('#EXTINF')===0){
        var c=l.lastIndexOf(',');name=c>=0?l.slice(c+1).trim():null;
        var m=l.match(/tvg-name="([^"]*)"/);if(!name&&m)name=m[1];
      }else if(l[0]!=='#'){
        out.push({name:name||l,url:l});name=null;
      }
    }
    return out;
  }

  function setChannels(arr){
    var seen={};channels=arr.filter(function(c){if(seen[c.url])return false;seen[c.url]=1;return true});
    save('btv.channels',channels);render();
    say(channels.length+' canales cargados');setTimeout(function(){say('')},2500);
  }

  function render(){
    var q=$('q').value.trim().toLowerCase();list.innerHTML='';
    shown=channels.filter(function(c){
      return (!onlyFav||favs[c.url])&&(!q||c.name.toLowerCase().indexOf(q)>=0);
    });
    if(!shown.length){
      var e=document.createElement('li');e.className='empty';
      e.textContent=channels.length?'Sin resultados.':'Aún no hay canales. Toca “+ Listas” para cargar una.';
      list.appendChild(e);return;
    }
    shown.slice(0,800).forEach(function(c){
      var li=document.createElement('li');if(cur&&cur.url===c.url)li.className='on';
      var b=document.createElement('button');b.className='name';b.textContent=c.name;b.title=c.name;
      b.onclick=function(){play(c)};
      var s=document.createElement('button');s.className='star'+(favs[c.url]?' f':'');s.textContent=favs[c.url]?'★':'☆';
      s.setAttribute('aria-label','Favorito');
      s.onclick=function(){if(favs[c.url])delete favs[c.url];else favs[c.url]=1;save('btv.favs',favs);render()};
      li.appendChild(b);li.appendChild(s);list.appendChild(li);
    });
  }

  function stop(){if(hls){hls.destroy();hls=null}}

  /* Filtro básico de publicidad: bloquea peticiones a dominios de anuncios conocidos */
  var ADS=/(doubleclick|googlesyndication|googleadservices|adservice\.google|imasdk|moatads|adnxs|adsrvr|scorecardresearch|taboola|outbrain|popads|propellerads)/i;

  function play(c){
    cur=c;now.textContent=c.name;say('Cargando…');stop();
    var u=c.url,isHls=/\.m3u8(\?|$)/i.test(u)||/\/hls\//i.test(u);
    if(isHls&&window.Hls&&Hls.isSupported()){
      hls=new Hls({lowLatencyMode:true,xhrSetup:function(x,url){if(ADS.test(url)){x.abort&&x.abort()}}});
      hls.loadSource(u);hls.attachMedia(v);
      hls.on(Hls.Events.MANIFEST_PARSED,function(){v.play().catch(function(){})});
      hls.on(Hls.Events.ERROR,function(_,d){
        if(d.fatal)say('No se pudo reproducir. El servidor puede bloquearlo o el enlace ya no sirve.',true);
      });
    }else{
      v.src=u;v.play().catch(function(){});
    }
    save('btv.last',c);
    /* marca el canal activo sin mover la lista */
    var items=list.children;
    for(var i=0;i<items.length;i++){items[i].className=(shown[i]&&shown[i].url===c.url)?'on':''}
    if('mediaSession' in navigator){
      navigator.mediaSession.metadata=new MediaMetadata({title:c.name,artist:'BTV Player'});
      try{navigator.mediaSession.setActionHandler('previoustrack',function(){step(-1)});
          navigator.mediaSession.setActionHandler('nexttrack',function(){step(1)})}catch(e){}
    }
  }

  /* Canal anterior / siguiente (sobre la lista que estás viendo, con búsqueda o favoritos) */
  function step(d){
    if(!shown.length)return;
    var i=-1;for(var k=0;k<shown.length;k++){if(cur&&shown[k].url===cur.url){i=k;break}}
    var n=i<0?(d>0?0:shown.length-1):(i+d+shown.length)%shown.length;
    play(shown[n]);
    var el=list.children[n];if(el&&el.scrollIntoView)el.scrollIntoView({block:'nearest'});
  }
  $('btnPrev').onclick=function(){step(-1)};
  $('btnNext').onclick=function(){step(1)};

  v.addEventListener('playing',function(){say('')});
  v.addEventListener('error',function(){if(!hls)say('No se pudo reproducir este enlace.',true)});

  /* Imagen en imagen */
  function pip(){
    if(!document.pictureInPictureEnabled){say('Este navegador no permite imagen en imagen. Usa Chrome.',true);return}
    if(document.pictureInPictureElement){document.exitPictureInPicture();return}
    if(v.readyState<2&&!v.src&&!hls){say('Primero elige un canal.',true);return}
    v.requestPictureInPicture().catch(function(e){say('No se pudo abrir la imagen en imagen: '+e.message,true)});
  }
  $('btnPip').onclick=pip;
  try{navigator.mediaSession.setActionHandler('enterpictureinpicture',function(){pip()})}catch(e){}
  document.addEventListener('visibilitychange',function(){
    if(document.hidden&&!v.paused&&document.pictureInPictureEnabled&&!document.pictureInPictureElement){
      v.requestPictureInPicture().catch(function(){});
    }
  });
  $('btnFull').onclick=function(){(v.requestFullscreen||v.webkitEnterFullscreen||function(){}).call(v)};

  /* Listas */
  $('btnAdd').onclick=function(){
    var o=$('addBox').classList.toggle('open');$('btnAdd').setAttribute('aria-expanded',o);
    if(o)$('scroll').scrollTop=0;
  };
  $('url').addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();$('btnPlay').click()}});
  $('btnGo').onclick=function(){$('btnPlay').click()};
  $('btnPlay').onclick=function(){
    var u=$('url').value.trim();if(!u)return;
    if(/\.m3u(\?|$)/i.test(u)){$('btnLoadList').click();return}
    if(/(famelack|tv\.garden)/i.test(u)){say('Ese es un enlace de página web, no de video. Usa un enlace .m3u8 o una lista .m3u.',true);return}
    if(/(youtube\.com|youtu\.be)/i.test(u)){say('Los enlaces de YouTube no se pueden reproducir aquí. Usa un enlace directo .m3u8 o .mp4.',true);return}
    play({name:u.replace(/^https?:\/\//,'').slice(0,60),url:u});
  };
  $('btnLoadList').onclick=function(){
    var u=$('url').value.trim();if(!u)return;say('Descargando lista…');
    fetch(u).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.text()})
      .then(function(t){var a=parseM3U(t);if(!a.length)throw new Error('La lista está vacía o no es M3U');setChannels(a)})
      .catch(function(e){say('No se pudo cargar la lista ('+e.message+'). Prueba abriendo el archivo o pegando el texto.',true)});
  };
  $('btnParse').onclick=function(){
    var a=parseM3U($('paste').value);
    if(!a.length){say('No encontré canales en ese texto.',true);return}
    setChannels(a);$('paste').value='';
  };
  $('btnFile').onclick=function(){$('file').click()};
  $('file').onchange=function(){
    var f=this.files[0];if(!f)return;
    var r=new FileReader();r.onload=function(){
      var a=parseM3U(String(r.result));
      if(!a.length){say('El archivo no tiene canales.',true);return}
      setChannels(a);
    };r.readAsText(f);this.value='';
  };
  $('btnClear').onclick=function(){channels=[];save('btv.channels',channels);render()};

  $('q').oninput=render;
  $('tabAll').onclick=function(){onlyFav=false;$('tabAll').setAttribute('aria-pressed',true);$('tabFav').setAttribute('aria-pressed',false);render()};
  $('tabFav').onclick=function(){onlyFav=true;$('tabAll').setAttribute('aria-pressed',false);$('tabFav').setAttribute('aria-pressed',true);render()};

  var deferred=null;
  window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();deferred=e;$('btnInstall').hidden=false});
  $('btnInstall').onclick=function(){if(!deferred)return;deferred.prompt();deferred=null;$('btnInstall').hidden=true};
  if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(function(){})}

  var last=load('btv.last',null);if(last){cur=last;now.textContent=last.name}
  render();
})();
</script>
</body>
</html>
